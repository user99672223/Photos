name: PhotoVault
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  PhotoVault:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PhotoVault
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photovault
        PRODUCT_NAME: PhotoVault
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    info:
      path: PhotoVault/Info.plist
      properties:
        CFBundleDisplayName: PhotoVault
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: PhotoVault backs up your photos and videos, encrypted, to your own STRATO HiDrive.
        CFBundleURLTypes:
          - CFBundleURLName: com.example.photovault
            CFBundleURLSchemes: [photovault]
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.example.photovault.backup]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        HiDriveClientID: $(HIDRIVE_CLIENT_ID)
        HiDriveClientSecret: $(HIDRIVE_CLIENT_SECRET)
